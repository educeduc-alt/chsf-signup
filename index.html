<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研習報名管理系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

:root{
  --navy:#1c2b4a; --navy2:#2d4070;
  --blue:#2563a8; --blue-lt:#e8f0fb; --blue-mid:#c8d9f5;
  --gold:#b8922a; --gold-lt:#fdf6e7;
  --green:#1d7a50; --green-lt:#e6f4ed;
  --red:#c0392b; --red-lt:#fcecea;
  --purple:#6d3fc5; --purple-lt:#eeebfc;
  --ink:#1a1a2e; --ink2:#4a4a6a; --ink3:#8888aa;
  --line:#e2e4ed; --line2:#f0f2f8;
  --bg:#f4f5f9; --white:#fff;
  --r:12px;
  --sh:0 1px 4px rgba(28,43,74,.07),0 4px 16px rgba(28,43,74,.06);
  --sh2:0 8px 32px rgba(28,43,74,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6}

/* ── HEADER ── */
.hdr{background:var(--navy);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;position:sticky;top:0;z-index:300;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.hdr-brand h1{font-family:'Noto Serif TC',serif;font-size:15px;color:#fff;font-weight:600;letter-spacing:.05em}
.hdr-brand p{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
.hdr-tabs{display:flex;gap:3px}
.htab{padding:6px 16px;font-size:13px;color:rgba(255,255,255,.5);background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;display:flex;align-items:center;gap:7px}
.htab.on{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.15)}
.htab:hover:not(.on){color:rgba(255,255,255,.75)}
.htab .cnt{background:var(--gold);color:#fff;font-size:10px;font-weight:500;padding:1px 7px;border-radius:99px}

/* ── PAGES ── */
.pg{display:none;min-height:calc(100vh - 56px)}
.pg.on{display:block}
.inner{max-width:940px;margin:0 auto;padding:32px 24px 72px}

/* ── STEP INDICATOR ── */
.steps{display:flex;align-items:center;gap:0;margin-bottom:28px}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.step.on{color:var(--blue);font-weight:500}
.step.done{color:var(--green)}
.snum{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;transition:all .2s}
.step.on .snum{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done .snum{background:var(--green);border-color:var(--green);color:#fff}
.sline{flex:1;height:1px;background:var(--line);margin:0 12px}
.step.done + .sline{background:var(--green)}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;margin-bottom:18px;box-shadow:var(--sh)}

/* ── UPLOAD ZONE ── */
.upzone{border:2px dashed var(--blue-mid);border-radius:10px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .18s;background:var(--line2);position:relative}
.upzone:hover,.upzone.drag{border-color:var(--blue);background:var(--blue-lt)}
.up-icon{width:52px;height:52px;background:var(--blue-lt);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.up-icon svg{width:26px;height:26px;stroke:var(--blue)}
.up-t{font-size:15px;font-weight:500;margin-bottom:5px}
.up-s{font-size:12px;color:var(--ink3)}
.up-s em{color:var(--blue);font-style:normal;font-weight:500;cursor:pointer}

/* ── PDF LIST ── */
.pdf-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pdf-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--line2);border:1px solid var(--line);border-radius:9px}
.pdf-icon{width:32px;height:32px;background:var(--red-lt);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pdf-icon svg{width:16px;height:16px;stroke:var(--red)}
.pdf-name{flex:1;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-status{font-size:11px;color:var(--ink3);flex-shrink:0}
.pdf-status.analyzing{color:var(--purple);font-weight:500}
.pdf-status.done{color:var(--green);font-weight:500}
.pdf-status.err{color:var(--red)}
.pdf-del{background:none;border:none;cursor:pointer;color:var(--ink3);padding:4px;border-radius:5px;display:flex;align-items:center;flex-shrink:0}
.pdf-del:hover{color:var(--red);background:var(--red-lt)}
.pdf-del svg{width:14px;height:14px}

/* ── PROGRESS ── */
.prog-wrap{margin-top:10px}
.pbar{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--navy2));border-radius:99px;transition:width .35s ease}
.pmsg{font-size:11px;color:var(--ink3);margin-top:5px}

/* ── ACTIVITY LIST ── */
.act-grid{display:flex;flex-direction:column;gap:12px}
.act-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:all .18s}
.act-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.act-card.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,168,.12)}
.act-hdr{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.act-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:2px}
.act-meta{font-size:12px;color:var(--ink3)}
.act-expand{font-size:11px;color:var(--blue);white-space:nowrap;flex-shrink:0;margin-top:4px;display:flex;align-items:center;gap:4px}
.act-expand svg{width:12px;height:12px;transition:transform .2s}
.act-card.active .act-expand svg{transform:rotate(180deg)}
.act-body{display:none;border-top:1px solid var(--line2);padding:18px 20px;background:#fbfcff;animation:fadeUp .2s ease}
.act-card.active .act-body{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── AI SUMMARY IN ACTIVITY ── */
.sum-pts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.spt{display:flex;gap:9px;font-size:13px;line-height:1.6}
.spt-ic{width:19px;height:19px;border-radius:50%;background:var(--blue-lt);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.spt-ic svg{width:10px;height:10px;stroke:var(--blue)}
.stags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stag{font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-mid)}

/* ── SESSION GRID ── */
.sess-label{font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:8px}
.sess-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sess-btn{padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--white);cursor:pointer;text-align:left;font-family:'Noto Sans TC',sans-serif;transition:all .16s;position:relative}
.sess-btn:hover{border-color:var(--blue-mid);background:var(--blue-lt)}
.sess-btn.sel{border-color:var(--blue);background:var(--blue-lt)}
.sess-btn .sd{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px}
.sess-btn .st{font-size:11px;color:var(--ink3)}
.sess-sel-mark{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;background:var(--blue);display:none;align-items:center;justify-content:center}
.sess-btn.sel .sess-sel-mark{display:flex}
.sess-sel-mark svg{width:9px;height:9px;stroke:#fff}

/* ── STEP 3 REG ── */
.reg-panel{background:var(--white);border:1px solid var(--blue-mid);border-radius:var(--r);padding:20px 24px;box-shadow:0 0 0 3px rgba(37,99,168,.08);display:none;animation:fadeUp .25s ease}
.reg-panel.on{display:block}
.rp-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.rp-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:500}
.rp-sel-info{font-size:12px;color:var(--blue);margin-top:3px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:12px;font-weight:500;color:var(--ink2)}
.req{color:var(--red);margin-left:2px}
.fg input{padding:10px 13px;font-size:14px;border:1.5px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);font-family:'Noto Sans TC',sans-serif;transition:all .15s;width:100%}
.fg input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,168,.1)}
.btn-submit{width:100%;padding:13px;background:linear-gradient(135deg,var(--blue),var(--navy2));color:#fff;font-size:14px;font-weight:500;border:none;border-radius:10px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .16s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.03em}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,168,.3)}
.btn-submit svg{width:16px;height:16px}

/* ── PAGE 2 ── */
.metabar{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 22px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:var(--sh)}
.mb-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:500}
.mb-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.mb-stats{display:flex;gap:28px}
.mbs .sv{font-size:24px;font-weight:500;font-family:'Noto Serif TC',serif;color:var(--blue)}
.mbs .sl{font-size:10px;color:var(--ink3)}

/* ── SESSION DB CARDS ── */
.sdb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.sdb-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);cursor:pointer;transition:all .16s;position:relative;overflow:hidden}
.sdb-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.c0::after{background:var(--blue)} .c1::after{background:var(--green)} .c2::after{background:var(--gold)} .c3::after{background:var(--purple)} .c4::after{background:var(--red)}
.sdb-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.sdb-card.active-s{border-color:var(--blue);background:var(--blue-lt)}
.sdb-act{font-size:11px;color:var(--ink3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdb-date{font-size:14px;font-weight:500;margin-bottom:1px}
.sdb-time{font-size:11px;color:var(--ink3);margin-bottom:10px}
.sdb-cnt{font-size:22px;font-weight:500;font-family:'Noto Serif TC',serif;color:var(--blue)}
.sdb-cl{font-size:10px;color:var(--ink3)}

/* ── SESSION TABS ── */
.stabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.stab{padding:9px 16px;font-size:13px;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .14s;display:flex;align-items:center;gap:6px}
.stab:hover{color:var(--ink)}
.stab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.stab .sc{background:var(--blue-lt);color:var(--blue);font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px}
.stab.on .sc{background:var(--blue);color:#fff}

/* ── REG TABLE ── */
.reg-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.rc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.rc-title{font-size:14px;font-weight:500}
.rc-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{padding:8px 10px;text-align:left;font-size:11px;font-weight:500;color:var(--ink3);border-bottom:1px solid var(--line);letter-spacing:.04em;text-transform:uppercase}
.rtable td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.rtable tr:last-child td{border-bottom:none}
.rtable tr:hover td{background:var(--line2)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}

/* ── DOC ── */
.doc-sender{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;margin-bottom:18px;box-shadow:var(--sh);display:none}
.ds-title{font-size:13px;font-weight:500;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.ds-hint{font-size:11px;color:var(--ink3);font-weight:400}
.ds-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.ds-grid .fg{margin-bottom:0}
.doc-out{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:none}
.do-hdr{background:var(--navy);padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.do-title{font-family:'Noto Serif TC',serif;font-size:15px;color:#fff;font-weight:500}
.do-badge{font-size:11px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.8);padding:3px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.18)}
.do-body{padding:26px 30px;font-size:14px;line-height:2.1;white-space:pre-wrap;font-family:'Noto Serif TC',serif;color:var(--ink);background:#fffef9;border-bottom:1px solid var(--line2);min-height:260px}
.do-actions{padding:14px 22px;display:flex;gap:9px;justify-content:flex-end}

/* ── BUTTONS ── */
.btn{padding:8px 18px;font-size:13px;border-radius:8px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:500;transition:all .14s;border:1px solid transparent}
.btn-p{background:linear-gradient(135deg,var(--blue),var(--navy2));color:#fff}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,168,.28)}
.btn-g{background:var(--white);color:var(--ink2);border-color:var(--line)}
.btn-g:hover{background:var(--line2)}
.btn-danger{background:var(--white);color:var(--red);border-color:#f0b8b8}
.btn-danger:hover{background:var(--red-lt)}

/* ── BADGE ── */
.bdg{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px}
.bdg-blue{background:var(--blue-lt);color:var(--blue)}
.bdg-green{background:var(--green-lt);color:var(--green)}

/* ── FG for doc ── */
.doc-sender .fg input{padding:8px 11px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font-family:'Noto Sans TC',sans-serif;transition:all .15s;width:100%}
.doc-sender .fg input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,168,.09)}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty svg{width:44px;height:44px;stroke:var(--line);margin:0 auto 12px;display:block}
.empty p{font-size:14px}
.empty .es{font-size:12px;margin-top:5px}

/* ── AI LOADING DOTS ── */
.dots::after{content:'';animation:dotanim 1s infinite}
@keyframes dotanim{0%{content:'.'}33%{content:'..'}66%{content:'...'}}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:all .22s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── SLABEL ── */
.slabel{font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:10px;margin-top:24px}
.slabel:first-child{margin-top:0}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <h1>研習活動報名管理系統</h1>
    <p>多份 PDF 上傳 → 場次摘要 → 報名 → 回文公文</p>
  </div>
  <div class="hdr-tabs">
    <button class="htab on" id="t1" onclick="goPage(1)">報名頁面</button>
    <button class="htab" id="t2" onclick="goPage(2)">場次資料庫 ＆ 公文 <span class="cnt" id="hcnt">0</span></button>
  </div>
</header>

<!-- ══════ PAGE 1 ══════ -->
<div class="pg on" id="p1">
<div class="inner">

  <!-- Step indicator -->
  <div class="steps">
    <div class="step on" id="si1"><div class="snum">1</div>上傳公文 PDF</div>
    <div class="sline" id="sl1"></div>
    <div class="step" id="si2"><div class="snum">2</div>選擇研習場次</div>
    <div class="sline" id="sl2"></div>
    <div class="step" id="si3"><div class="snum">3</div>填寫姓名報名</div>
  </div>

  <!-- STEP 1: Upload -->
  <div id="step1-area">
    <div class="card">
      <div class="upzone" id="upzone"
           ondragover="ev.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="onDrop(event)"
           onclick="document.getElementById('fup').click()">
        <div class="up-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <div class="up-t">拖曳一份或多份公文 PDF 至此</div>
        <div class="up-s">或 <em onclick="event.stopPropagation();document.getElementById('fup').click()">點此選擇檔案</em>（可一次選多個），Claude AI 自動讀取摘要</div>
      </div>
      <input type="file" id="fup" accept=".pdf" multiple style="display:none" onchange="onFiles(this)">
      <div class="pdf-list" id="pdf-list"></div>
    </div>

    <div id="act-grid-wrap" style="display:none">
      <div class="slabel">已分析的研習活動</div>
      <div class="act-grid" id="act-grid"></div>
    </div>
  </div>

  <!-- STEP 2: Session detail panel (shown after clicking an activity) -->
  <div id="step2-area" style="display:none">
    <div class="card" style="border-color:var(--blue-mid)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
        <div>
          <div style="font-family:'Noto Serif TC',serif;font-size:17px;font-weight:500" id="s2-title"></div>
          <div style="font-size:12px;color:var(--ink3);margin-top:3px" id="s2-meta"></div>
        </div>
        <button class="btn btn-g" style="font-size:12px;padding:5px 12px;flex-shrink:0" onclick="backToStep1()">← 返回</button>
      </div>

      <!-- AI Summary -->
      <div style="background:var(--blue-lt);border:1px solid var(--blue-mid);border-radius:10px;padding:14px 16px;margin-bottom:18px">
        <div style="font-size:11px;font-weight:500;color:var(--blue);display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Claude AI 研習摘要
        </div>
        <div class="sum-pts" id="s2-pts"></div>
        <div class="stags" id="s2-tags"></div>
      </div>

      <!-- Sessions -->
      <div class="sess-label">選擇欲參加的場次</div>
      <div class="sess-grid" id="s2-sess-grid"></div>
    </div>
  </div>

  <!-- STEP 3: Register -->
  <div id="step3-area" style="display:none">
    <div class="reg-panel on" id="regpanel">
      <div class="rp-hdr">
        <div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════
   DATABASE
   acts[]  → 每份 PDF 對應一個 activity
   sess_   → 各場次獨立鍵值
═══════════════════════════════════════ */
const K_ACTS = 'ws3_acts';
const K_SESS = 'ws3_sess_';

function dbG(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } }
function dbS(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
function dbD(k){ localStorage.removeItem(k); }

function getActs(){ return dbG(K_ACTS)||[]; }
function setActs(v){ dbS(K_ACTS,v); }
function sessKey(actId,d,t){ return K_SESS+actId+'_'+btoa(encodeURIComponent(d+'|'+t)).replace(/=/g,''); }
function getSess(actId,d,t){ return dbG(sessKey(actId,d,t))||{actId,date:d,time:t,regs:[]}; }
function setSess(actId,d,t,v){ dbS(sessKey(actId,d,t),v); }

function getAllSessions(){
  const acts=getActs(); const all=[];
  acts.forEach(a=>{ a.dates.forEach(dt=>{ all.push(getSess(a.id,dt.d,dt.t)); }); });
  return all;
}
function getAllRegs(){ return getAllSessions().flatMap(s=>s.regs); }
function wipeAll(){
  const acts=getActs();
  acts.forEach(a=>{ a.dates.forEach(dt=>{ dbD(sessKey(a.id,dt.d,dt.t)); }); });
  dbD(K_ACTS);
}

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let currentStep = 1;
let selectedActId = null;
let selectedDate  = null;
let selectedTime  = null;
let activeSess    = '__all__';

/* ═══════════════════════════════════════
   NAV
═══════════════════════════════════════ */
function goPage(n){
  document.getElementById('p1').classList.toggle('on',n===1);
  document.getElementById('p2').classList.toggle('on',n===2);
  document.getElementById('t1').classList.toggle('on',n===1);
  document.getElementById('t2').classList.toggle('on',n===2);
  if(n===2) renderP2();
}
function updateBadge(){ document.getElementById('hcnt').textContent=getAllRegs().length; }

function setStep(n){
  currentStep=n;
  [1,2,3].forEach(i=>{
    const si=document.getElementById('si'+i);
    si.className='step'+(i<n?' done':i===n?' on':'');
    if(i<3) document.getElementById('sl'+i).style.background=i<n?'var(--green)':'var(--line)';
  });
  document.getElementById('step1-area').style.display = n===1?'block':'none';
  document.getElementById('step2-area').style.display = n===2?'block':'none';
  document.getElementById('step3-area').style.display = n===3?'block':'none';
}

function backToStep1(){ selectedActId=null; setStep(1); }
function backToStep2(){ selectedDate=null; selectedTime=null; setStep(2); }

/* ═══════════════════════════════════════
   PDF UPLOAD
═══════════════════════════════════════ */
let processingQueue = [];
let isProcessing = false;

function onDrop(e){
  e.preventDefault();
  document.getElementById('upzone').classList.remove('drag');
  processFileList(e.dataTransfer.files);
}
function onFiles(inp){ processFileList(inp.files); inp.value=''; }

function processFileList(files){
  Array.from(files).forEach(f=>{ if(f.type==='application/pdf') queueFile(f); });
  drainQueue();
}

function queueFile(file){
  const id = 'pdf_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  processingQueue.push({id, file});
  addPdfRow(id, file.name);
}

async function drainQueue(){
  if(isProcessing) return;
  isProcessing=true;
  while(processingQueue.length){
    const {id, file} = processingQueue.shift();
    setPdfStatus(id,'analyzing','AI 分析中…');
    try{
      const b64 = await toBase64(file);
      const data = await callClaude(b64);
      data.id = id;
      data.filename = file.name;
      const acts = getActs();
      const existing = acts.findIndex(a=>a.id===id);
      if(existing>=0) acts[existing]=data; else acts.push(data);
      setActs(acts);
      data.dates.forEach(dt=>{ const s=getSess(id,dt.d,dt.t); setSess(id,dt.d,dt.t,s); });
      setPdfStatus(id,'done','✓ 分析完成');
      renderActGrid();
      updateBadge();
    }catch(e){
      console.warn(e);
      setPdfStatus(id,'err','分析失敗，請重試');
    }
  }
  isProcessing=false;
}

function toBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function callClaude(b64){
  const prompt=`請仔細閱讀這份公文 PDF，以 JSON 格式回傳（只回傳 JSON，不加任何說明或 markdown）：
{
  "title":"活動完整名稱",
  "org":"主辦機關全銜",
  "ref":"公文字號",
  "deadline":"報名截止日期（民國格式如113/05/20，無則留空）",
  "place":"活動地點",
  "hours":"研習時數（如：3小時，無則留空）",
  "pts":["重點摘要1","重點摘要2","重點摘要3","重點摘要4"],
  "tags":["標籤1（含時數如研習時數3hr）","標籤2","標籤3"],
  "dates":[{"d":"日期如113/05/14（二）","t":"時段如09:00–12:00"}]
}
注意：dates 陣列列出所有開放場次。`;

  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1500,
      messages:[{role:'user',content:[
        {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},
        {type:'text',text:prompt}
      ]}]
    })
  });
  if(!resp.ok) throw new Error('API '+resp.status);
  const data=await resp.json();
  const raw=data.content.map(c=>c.text||'').join('');
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

/* ── PDF row UI ── */
function addPdfRow(id, name){
  const list=document.getElementById('pdf-list');
  const div=document.createElement('div');
  div.className='pdf-item'; div.id='prow_'+id;
  div.innerHTML=`
    <div class="pdf-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <div class="pdf-name">${name}</div>
    <span class="pdf-status analyzing" id="pstat_${id}"><span class="dots">分析中</span></span>
    <button class="pdf-del" onclick="removePdf('${id}')" title="移除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  list.appendChild(div);
}
function setPdfStatus(id, cls, text){
  const el=document.getElementById('pstat_'+id);
  if(!el) return;
  el.className='pdf-status '+cls;
  el.textContent=text;
}
function removePdf(id){
  const acts=getActs(); const act=acts.find(a=>a.id===id);
  if(act) act.dates.forEach(dt=>dbD(sessKey(id,dt.d,dt.t)));
  setActs(acts.filter(a=>a.id!==id));
  const row=document.getElementById('prow_'+id); if(row) row.remove();
  processingQueue=processingQueue.filter(q=>q.id!==id);
  renderActGrid(); updateBadge();
}

/* ═══════════════════════════════════════
   STEP 1 — ACTIVITY GRID
═══════════════════════════════════════ */
function renderActGrid(){
  const acts=getActs();
  const wrap=document.getElementById('act-grid-wrap');
  const grid=document.getElementById('act-grid');
  if(!acts.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  grid.innerHTML=acts.map(a=>{
    const totalRegs=a.dates.reduce((s,dt)=>s+getSess(a.id,dt.d,dt.t).regs.length,0);
    return `<div class="act-card${selectedActId===a.id?' active':''}" id="acard_${a.id}">
      <div class="act-hdr" onclick="openAct('${a.id}')">
        <div>
          <div class="act-title">${a.title}</div>
          <div class="act-meta">${a.org}${a.ref?' ・ '+a.ref:''}${a.deadline?' ・ 截止 '+a.deadline:''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
          ${totalRegs>0?`<span class="bdg bdg-blue">${totalRegs} 人報名</span>`:''}
          <div class="act-expand">選擇場次 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openAct(id){
  selectedActId=id;
  const act=getActs().find(a=>a.id===id); if(!act) return;

  // Populate step 2
  document.getElementById('s2-title').textContent=act.title;
  document.getElementById('s2-meta').textContent=[act.org,act.ref,act.deadline?'截止 '+act.deadline:'',act.place,act.hours?'研習時數：'+act.hours:''].filter(Boolean).join('  ・  ');
  document.getElementById('s2-pts').innerHTML=act.pts.map(p=>`<div class="spt"><div class="spt-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div><span>${p}</span></div>`).join('');
  document.getElementById('s2-tags').innerHTML=act.tags.map(t=>`<span class="stag">${t}</span>`).join('');

  const sg=document.getElementById('s2-sess-grid');
  sg.innerHTML=act.dates.map(dt=>`
    <button class="sess-btn" onclick="pickSess('${dt.d.replace(/'/g,"\\'")}','${dt.t.replace(/'/g,"\\'")}')">
      <div class="sess-sel-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
      <div class="sd">${dt.d}</div>
      <div class="st">${dt.t}</div>
    </button>`).join('');

  setStep(2);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ═══════════════════════════════════════
   STEP 2 — PICK SESSION
═══════════════════════════════════════ */
function pickSess(d, t){
  selectedDate=d; selectedTime=t;
  document.querySelectorAll('.sess-btn').forEach(b=>b.classList.remove('sel'));
  event.currentTarget.classList.add('sel');

  document.getElementById('rp-info').textContent=`${d}　${t}`;
  document.getElementById('fn').value='';
  document.getElementById('step3-area').style.display='block';
  setStep(3);
  setTimeout(()=>document.getElementById('fn').focus(),100);
  document.getElementById('step3-area').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ═══════════════════════════════════════
   STEP 3 — SUBMIT
═══════════════════════════════════════ */
function submitReg(){
  const name=document.getElementById('fn').value.trim();
  if(!name){ toast('請填寫姓名'); return; }
  if(!selectedActId||!selectedDate){ toast('請先選擇場次'); return; }

  const act=getActs().find(a=>a.id===selectedActId)||{};
  const now=new Date();
  const ts=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const reg={id:Date.now(),name,date:selectedDate,time:selectedTime,actTitle:act.title||'—',actRef:act.ref||'—',actOrg:act.org||'—',regTime:ts};
  const sess=getSess(selectedActId,selectedDate,selectedTime);
  sess.regs.push(reg);
  setSess(selectedActId,selectedDate,selectedTime,sess);

  updateBadge();
  renderActGrid();
  toast(`✓ ${name} 完成報名：${selectedDate} ${selectedTime}`);

  // Reset to step 2 for next person
  document.getElementById('fn').value='';
  document.getElementById('step3-area').style.display='none';
  setStep(2);
  // Unselect session btn
  document.querySelectorAll('.sess-btn').forEach(b=>b.classList.remove('sel'));
  selectedDate=null; selectedTime=null;
}

/* ═══════════════════════════════════════
   PAGE 2
═══════════════════════════════════════ */
function renderP2(){
  const acts=getActs();
  const allRegs=getAllRegs();
  const allSess=getAllSessions();

  document.getElementById('st-total').textContent=allRegs.length;
  document.getElementById('st-sess').textContent=allSess.length;
  document.getElementById('st-acts').textContent=acts.length;

  if(acts.length){
    document.getElementById('p2title').textContent=acts.length===1?acts[0].title:`${acts.length} 份研習活動`;
    document.getElementById('p2sub').textContent=acts.map(a=>a.title).join('、');
  }

  const CLS=['c0','c1','c2','c3','c4'];
  const grid=document.getElementById('sdb-grid');
  if(!allSess.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1;padding:28px 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p>尚無場次資料</p><div class="es">請先上傳 PDF</div></div>`;
    document.getElementById('stabs').innerHTML='';
    document.getElementById('docsender').style.display='none';
    renderSessList(); return;
  }

  let ci=0;
  grid.innerHTML=acts.flatMap(a=>a.dates.map(dt=>{
    const sess=getSess(a.id,dt.d,dt.t);
    const key=a.id+'|'+dt.d+'|'+dt.t;
    const isAct=activeSess===key;
    const c=CLS[(ci++)%5];
    return `<div class="sdb-card ${c}${isAct?' active-s':''}" onclick="pickP2Sess('${key}')">
      <div class="sdb-act">${a.title}</div>
      <div class="sdb-date">${dt.d}</div>
      <div class="sdb-time">${dt.t}</div>
      <div class="sdb-cnt">${sess.regs.length}</div>
      <div class="sdb-cl">已報名人數</div>
    </div>`;
  })).join('');

  // Tabs
  const tabAll=`<button class="stab${activeSess==='__all__'?' on':''}" onclick="pickP2Sess('__all__')">全部場次 <span class="sc">${allRegs.length}</span></button>`;
  const tabActs=acts.map(a=>a.dates.map(dt=>{
    const sess=getSess(a.id,dt.d,dt.t);
    const key=a.id+'|'+dt.d+'|'+dt.t;
    const shortTitle=a.title.length>10?a.title.slice(0,10)+'…':a.title;
    return `<button class="stab${activeSess===key?' on':''}" onclick="pickP2Sess('${key}')">${shortTitle} ${dt.d} <span class="sc">${sess.regs.length}</span></button>`;
  }).join('')).join('');
  document.getElementById('stabs').innerHTML=tabAll+tabActs;

  document.getElementById('docsender').style.display=allRegs.length?'block':'none';
  updateDsHint();
  renderSessList();
  document.getElementById('docout').style.display='none';
}

function pickP2Sess(key){ activeSess=key; renderP2(); }

function renderSessList(){
  const acts=getActs();
  let regs,title,sub;
  if(activeSess==='__all__'){
    regs=getAllRegs(); title='全部場次報名名單'; sub=`共 ${regs.length} 人`;
  } else {
    const [actId,d,t]=activeSess.split('|');
    const act=acts.find(a=>a.id===actId)||{};
    const sess=getSess(actId,d,t);
    regs=sess.regs; title=`${d}　${t}`; sub=`${act.title||''}　共 ${regs.length} 人`;
  }
  document.getElementById('rc-title').textContent=title;
  document.getElementById('rc-sub').textContent=sub;
  document.getElementById('rc-cnt').textContent=`共 ${regs.length} 人`;

  const body=document.getElementById('regbody');
  if(!regs.length){
    body.innerHTML=`<div class="empty" style="padding:28px 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>此場次尚無報名資料</p></div>`;
    return;
  }
  const CS=['#E8F0FB','#E6F4ED','#FDF6E7','#FCECEA','#EEEDFE'];
  const CT=['#1a3a6a','#1d5a38','#6b4a0a','#6a1f1a','#3a3282'];
  body.innerHTML=`<table class="rtable">
    <thead><tr><th>#</th><th>姓名</th><th>場次</th><th>報名時間</th></tr></thead>
    <tbody>${regs.map((r,i)=>{
      const ci=i%CS.length;
      return `<tr>
        <td style="color:var(--ink3);font-size:12px">${i+1}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:${CS[ci]};color:${CT[ci]}">${r.name.slice(-2)}</div><span style="font-weight:500">${r.name}</span></div></td>
        <td><span style="font-size:12px;color:var(--blue)">${r.date}</span><br><span style="font-size:11px;color:var(--ink3)">${r.time}</span></td>
        <td style="color:var(--ink3);font-size:12px">${r.regTime}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function updateDsHint(){
  const hint=document.getElementById('dshint');
  if(activeSess==='__all__') hint.textContent='（目前：全部場次統整）';
  else{ const parts=activeSess.split('|'); hint.textContent=`（目前：${parts[1]} ${parts[2]}）`; }
}

/* ═══════════════════════════════════════
   GENERATE DOC
═══════════════════════════════════════ */
function genDoc(scope){
  const acts=getActs();
  let regs,dateDesc,scopeLabel,actInfo;

  if(scope==='all'){
    regs=getAllRegs();
    const ds=[...new Set(regs.map(r=>r.date))];
    dateDesc=ds.join('、'); scopeLabel='全部場次';
    actInfo=regs.length?{title:regs[0].actTitle,ref:regs[0].actRef,org:regs[0].actOrg}:{};
  } else {
    if(activeSess==='__all__'){
      regs=getAllRegs();
      const ds=[...new Set(regs.map(r=>r.date))];
      dateDesc=ds.join('、'); scopeLabel='全部場次';
      actInfo=regs.length?{title:regs[0].actTitle,ref:regs[0].actRef,org:regs[0].actOrg}:{};
    } else {
      const [actId,d,t]=activeSess.split('|');
      const act=acts.find(a=>a.id===actId)||{};
      const sess=getSess(actId,d,t);
      regs=sess.regs; dateDesc=d+' '+t; scopeLabel=dateDesc;
      actInfo={title:act.title||'—',ref:act.ref||'—',org:act.org||'—'};
    }
  }
  if(!regs.length){ toast('此範圍尚無報名資料'); return; }

  const sOrg=document.getElementById('do-org').value.trim()||'○○機關';
  const sP=document.getElementById('do-person').value.trim()||'○○○';
  const sT=document.getElementById('do-title').value.trim()||'承辦人';
  const sTel=document.getElementById('do-tel').value.trim()||'04-○○○○○○○○';
  const now=new Date();
  const ds=`${now.getFullYear()-1911}年${now.getMonth()+1}月${now.getDate()}日`;

  const byDate={};
  regs.forEach(r=>{ if(!byDate[r.date]) byDate[r.date]=[]; byDate[r.date].push(r); });
  let nameBlock;
  if(Object.keys(byDate).length===1){
    nameBlock=regs.map((r,i)=>`    ${i+1}. ${r.name}`).join('\n');
  } else {
    nameBlock=Object.entries(byDate).map(([d,list])=>
      `  【${d}】\n`+list.map((r,i)=>`    ${i+1}. ${r.name}`).join('\n')
    ).join('\n');
  }

  const doc=`主　旨：復 貴機關 ${actInfo.ref||'○○字第○號'} 函，有關「${actInfo.title||'○○研習活動'}」辦理參加報名乙案（${scopeLabel}），本機關計有 ${regs.length} 名人員擬參加，請查照。

說　明：
一、依據 貴機關函示，就「${actInfo.title||'○○研習活動'}」辦理招募事宜，本機關收悉後即轉知所屬人員，並彙整參加意願如下。

二、本機關擬參加人員名單如下，共計 ${regs.length} 人：
${nameBlock}

三、參加場次：${dateDesc}

四、如需補充相關資料，請洽本機關承辦人 ${sP}（${sT}），聯絡電話：${sTel}，本機關將全力配合辦理。

正　本：${actInfo.org||'○○機關'}
副　本：本機關存查


                                        ${sOrg}
                                        ${sT}　${sP}
                                        中華民國 ${ds}`;

  document.getElementById('do-title-out').textContent=scope==='all'?'統整回文公文草稿（全部場次）':`回文公文草稿（${scopeLabel}）`;
  document.getElementById('do-body').textContent=doc;
  document.getElementById('do-badge').textContent=`共 ${regs.length} 名報名者`;
  document.getElementById('docout').style.display='block';
  document.getElementById('docout').scrollIntoView({behavior:'smooth'});
}

function cpDoc(withMsg){
  navigator.clipboard.writeText(document.getElementById('do-body').textContent).then(()=>{
    toast(withMsg?'已複製！請至公文系統貼上。':'公文全文已複製到剪貼簿');
  });
}

function clearAll(){
  if(!confirm('確定清除所有活動與報名資料？')) return;
  wipeAll();
  document.getElementById('pdf-list').innerHTML='';
  document.getElementById('act-grid-wrap').style.display='none';
  activeSess='__all__'; selectedActId=null;
  setStep(1);
  renderP2(); updateBadge();
  toast('已清除所有資料');
}

/* ── TOAST ── */
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('on'),2800);
}

/* ── INIT ── */
updateBadge();
const _acts=getActs();
if(_acts.length){ renderActGrid(); document.getElementById('act-grid-wrap').style.display='block'; }
</script>
